<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TROVIA | Adventure Awaits</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <div class="icon">▲▲</div>
      <span>TROVIA</span>
    </div>
    <nav class="nav-links">
      <a href="#">Explore</a>
      <a href="#">Community</a>
      <a href="#">Rewards</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
    </nav>
    <div class="nav-buttons">
      <button class="sign-in">Sign In</button>
      <button class="get-started">Get Started</button>
    </div>
  </header>

  <section class="hero">
    <div class="overlay-circle"></div>
    <img src="/images/sun.png" class="birds" alt="Birds flying" />
    <div class="hero-content">
      <h1><span>YOUR NEXT</span><br><strong>ADVENTURE AWAITS</strong></h1>
      <p>Live your dream and explore</p>
      <div class="cta-buttons">
        <button class="btn-primary">Explore Treks</button>
        <button class="btn-secondary">Join the tribe</button>
      </div>
    </div>
    <img src="/images/mountains.png" class="background-img" alt="Mountains" />
  </section>

</body>
</html>
